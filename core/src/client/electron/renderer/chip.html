<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WHACK Floating Widget</title>
  <style>
    :root {
      --bg-pill: #faf9f5;
      --border-pill: rgba(20, 20, 19, 0.14);
      --text-main: #141413;
      --text-muted: #71716b;
      --btn-dark: #141413;
      --btn-dark-hover: #292927;
      --green: #0f9d76;
      --amber: #d97706;
      --coral: #f25533;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    /* High-contrast Warm Paper pill that pops off dark-mode VS Code */
    .widget {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 42px;
      margin: 5px 6px;
      padding: 0 5px 0 10px;
      border-radius: 999px;
      background: var(--bg-pill);
      border: 1.5px solid var(--border-pill);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.38), 0 2px 6px rgba(0, 0, 0, 0.2);
      color: var(--text-main);
      -webkit-app-region: drag;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .widget.is-stuck {
      border-color: var(--coral);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45), 0 0 0 3px rgba(242, 85, 51, 0.28);
    }

    .left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ring-wrap {
      position: relative;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .ring-svg {
      position: absolute;
      inset: 0;
      transform: rotate(-90deg);
    }

    .ring-bg {
      fill: none;
      stroke: rgba(20, 20, 19, 0.1);
      stroke-width: 2.4;
    }

    .ring-fg {
      fill: none;
      stroke: var(--green);
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-dasharray: 50.26;
      stroke-dashoffset: 50.26;
      transition: stroke-dashoffset 0.35s ease, stroke 0.25s ease;
    }

    .core-dot {
      width: 6.5px;
      height: 6.5px;
      border-radius: 50%;
      background: var(--green);
      transition: background 0.25s ease;
    }

    .status-meta {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .status-badge {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--text-main);
    }

    .score-mono {
      font-family: ui-monospace, "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 4px;
      -webkit-app-region: no-drag;
    }

    .btn-diagnose {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 29px;
      padding: 0 10px;
      border-radius: 999px;
      background: var(--btn-dark);
      border: 1px solid var(--btn-dark);
      color: #faf9f5;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.12s ease;
    }

    .btn-diagnose:hover {
      background: var(--btn-dark-hover);
    }

    .kbd {
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 9.5px;
      color: #d4d4d0;
      background: rgba(255, 255, 255, 0.12);
      padding: 1px 4px;
      border-radius: 3px;
    }

    .btn-expand {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1px solid transparent;
      color: #52524e;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .btn-expand:hover {
      background: rgba(20, 20, 19, 0.08);
      color: var(--text-main);
    }
  </style>
</head>
<body>
  <div id="widget" class="widget">
    <div class="left">
      <div class="ring-wrap">
        <svg class="ring-svg" width="24" height="24" viewBox="0 0 22 22">
          <circle class="ring-bg" cx="11" cy="11" r="8"></circle>
          <circle id="ringFg" class="ring-fg" cx="11" cy="11" r="8"></circle>
        </svg>
        <div id="coreDot" class="core-dot"></div>
      </div>
      <div class="status-meta">
        <span id="statusText" class="status-badge">Nominal</span>
        <span id="scoreText" class="score-mono">0.00</span>
      </div>
    </div>

    <div class="controls">
      <button id="btnDiagnose" class="btn-diagnose" title="Run Diagnosis (Ctrl+Shift+K)">
        <span>Ask</span>
        <span class="kbd">⌃⇧K</span>
      </button>
      <button id="btnExpand" class="btn-expand" title="Toggle Incident & Suggestion Panel">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <path d="M9 3v18"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const widget = document.getElementById("widget");
    const ringFg = document.getElementById("ringFg");
    const coreDot = document.getElementById("coreDot");
    const statusText = document.getElementById("statusText");
    const scoreText = document.getElementById("scoreText");
    const btnDiagnose = document.getElementById("btnDiagnose");
    const btnExpand = document.getElementById("btnExpand");

    const CIRCUMFERENCE = 50.26;

    btnDiagnose.addEventListener("click", () => {
      if (window.whackElectron) window.whackElectron.triggerDiagnose("hint");
    });

    btnExpand.addEventListener("click", () => {
      if (window.whackElectron) window.whackElectron.togglePanel();
    });

    function setRing(score, color) {
      const clamped = Math.max(0.06, Math.min(1, Number(score || 0)));
      ringFg.style.strokeDashoffset = String(CIRCUMFERENCE * (1 - clamped));
      ringFg.style.stroke = color;
      coreDot.style.background = color;
    }

    function updateState(score, faceState, cooldownUntil, cameraPaused) {
      const val = Number(score || 0);
      scoreText.textContent = cameraPaused ? "PAUSED" : val.toFixed(2);
      widget.classList.remove("is-stuck");

      if (cooldownUntil && cooldownUntil > Date.now()) {
        statusText.textContent = "Snoozed";
        setRing(0.1, "#71716b");
        return;
      }

      if (faceState === "confused" || val >= 0.7) {
        statusText.textContent = "Stuck";
        widget.classList.add("is-stuck");
        setRing(val, "#f25533");
      } else if (val >= 0.4) {
        statusText.textContent = "Drifting";
        setRing(val, "#d97706");
      } else {
        statusText.textContent = "Nominal";
        setRing(Math.max(0.14, val), "#0f9d76");
      }
    }

    function connectWs() {
      const ws = new WebSocket("ws://127.0.0.1:3000/ws");
      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === "status") {
            updateState(
              msg.confusionScore,
              msg.faceState,
              msg.cooldownUntil,
              msg.cameraPaused
            );
          } else if (msg.type === "nudge") {
            updateState(msg.score || 0.85, "confused", null, false);
            if (window.whackElectron) window.whackElectron.showPanel();
          }
        } catch (e) {
          console.error(e);
        }
      };
      ws.onclose = () => setTimeout(connectWs, 1500);
    }

    connectWs();
  </script>
</body>
</html>
