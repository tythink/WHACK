version: '3.8'

services:
  emotion-service:
    build:
      context: .
      dockerfile: Dockerfile.emotion
    container_name: whack-emotion
    ports:
      - "5001:5001"
    environment:
      - PYTHONUNBUFFERED=1
    command: python src/services/emotion/server.py --port 5001 --mock
    restart: unless-stopped

  orchestrator-service:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    container_name: whack-orchestrator
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
    command: python src/orchestrator/server.py --port 8080 --emotion-port 5001 --action-port 5002
    depends_on:
      - emotion-service
    restart: unless-stopped
